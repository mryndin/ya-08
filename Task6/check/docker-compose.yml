version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-net

  backend1:
    image: traefik/whoami
    container_name: backend1
    networks:
      - app-net

  backend2:
    image: traefik/whoami
    container_name: backend2
    networks:
      - app-net

  backend3:
    image: traefik/whoami
    container_name: backend3
    networks:
      - app-net

networks:
  app-net:
    driver: bridge