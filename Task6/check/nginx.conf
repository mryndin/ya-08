worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 📌 Зона ограничения: ключ = IP клиента, 10 МБ памяти, лимит 10 запросов/мин
    limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=10r/m;
    
    # 📌 При превышении лимита возвращаем 429 вместо стандартного 503
    limit_req_status 429;

    upstream backend_servers {
        server backend1:80;
        server backend2:80;
        server backend3:80;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Применяем правило ограничения к location
            limit_req zone=rate_limit;
            
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}