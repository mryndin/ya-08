http {
    # 📌 Зона ограничения запросов
    # $binary_remote_addr — ключ ограничения (IP-адрес клиента)
    # zone=rate_limit:10m — имя зоны и размер разделяемой памяти (хватит для ~160 000 уникальных IP)
    # rate=10r/m — строгий лимит: не более 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=10r/m;

    # 📌 Возвращать HTTP 429 вместо стандартного 503 при превышении лимита
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # 📌 Применяем правило ограничения к данному location
            # burst=0 (по умолчанию) — запросы сверх лимита сразу отклоняются
            limit_req zone=rate_limit;

            proxy_pass http://backend_servers;
        }
    }
}